:root{
  --bg:#0B2D5A;
  --bg2:#06203f;
  --surface:#0e3a72;
  --surface2:#123f7d;
  --line:#00C6FB;
  --cyan:#00C6FB;
  --green:#00E676;
  --yellow:#FFD166;
  --pink:#FF4D8D;
  --text:#F4FBFF;
  --muted:#C7DEf5;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Nunito',system-ui,sans-serif
}

h1,h2,h3,.display{
  font-family:'Archivo Black',system-ui,sans-serif;
  letter-spacing:.02em
}

button,input,select{
  font-family:inherit
}

button{
  cursor:pointer
}

.tab-btn{
  white-space:nowrap
}

input[type=range]{
  accent-color:var(--green);
  width:100%;
  height:14px
}

input[type=text],input[type=number],select{
  background:#06264f;
  color:white;
  border:2px solid #2b6bb5;
  border-radius:12px;
  padding:12px 14px;
  font-size:18px;
  width:100%;
  outline:none
}

input:focus,select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,198,251,.25)
}

.card{
  background:linear-gradient(145deg,#113f7f,#0a2e60);
  border:2px solid rgba(0,198,251,.38);
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.25)
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 18px;
  font-weight:900;
  font-size:18px;
  line-height:1.1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.15s
}

.btn:active{
  transform:scale(.97)
}

.btn-cyan{
  background:var(--cyan);
  color:#03233c
}

.btn-green{
  background:var(--green);
  color:#032c18
}

.btn-ghost{
  background:transparent;
  border:2px solid rgba(255,255,255,.35);
  color:white
}

.btn-dark{
  background:#06264f;
  color:white;
  border:2px solid #2b6bb5
}

.chip{
  border-radius:999px;
  padding:8px 12px;
  font-weight:900;
  border:2px solid rgba(255,255,255,.25);
  background:#06264f
}

.chip.active{
  background:var(--cyan);
  color:#03233c;
  border-color:var(--cyan)
}

@keyframes float{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0)
  }

  100%{
    transform:translateY(520px) rotate(720deg)
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(0,230,118,.45)
  }

  50%{
    box-shadow:0 0 0 12px rgba(0,230,118,0)
  }
}

.blink{
  animation:blink .55s infinite
}

.float{
  animation:float 3s ease-in-out infinite
}

.confetti{
  position:absolute;
  top:0;
  width:12px;
  height:18px;
  animation:fall 2.8s ease-in infinite;
  border-radius:3px
}

.no-x{
  overflow-x:clip
}

::-webkit-scrollbar{
  height:10px;
  width:10px
}

::-webkit-scrollbar-thumb{
  background:#2b6bb5;
  border-radius:99px
}

.hover\:bg-white\/5:hover {
  background-color: rgb(255 255 255 / 0.05);
}

.active\:cursor-grabbing:active {
  cursor: grabbing;
}

  .sm\:inline {
    display: inline;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-\[1fr_auto_auto\] {

  }

  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-8 {
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

  .md\:inline {

  }

    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));

    grid-template-columns: .85fr 1.15fr;
  }

  }

  .lg\:grid-cols-\[1\.3fr_\.7fr\] {
    grid-template-columns: 1.3fr .7fr;
  }
}
